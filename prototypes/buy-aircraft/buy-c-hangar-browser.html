 <div class="specs"><div class="sp"><span class="k">Seats</span><b>${a.seats}</b><div class="bar"><i style="width:${a.seats/555*100}%"></i></div></div><div class="sp"><span class="k">Range</span><b>${a.range.toLocaleString()} mi</b><div class="bar"><i style="width:${a.range/8700*100}%"></i></div></div><div class="sp"><span class="k">Cruise</span><b>${a.speed} mph</b><div class="bar"><i style="width:${a.speed/1300*100}%"></i></div></div><div class="sp"><span class="k">Efficiency</span><b>${a.fuel}</b><div class="bar"><i style="width:${a.fuel}%"></i></div></div></div>
 <div class="two"><div class="panel fit"><span class="k">Role &amp; fit</span><p>${a.role}</p><ul><li><span>Cost per seat</span><b>$${Math.round(a.cost/a.seats*1000)}k</b></li><li><span>Fits your routes</span><b>${fits.length} of ${ROUTES.length}</b></li>${fits.slice(0,3).map(r=>`<li class="muted"><span>${r[0]} → ${r[1]}</span><span>${r[2].toLocaleString()} mi</span></li>`).join('')}</ul></div>
 <div class="panel buy"><span class="k">Order</span><div style="display:flex;align-items:center;gap:10px"><div class="stepper"><button onclick="Q=Math.max(1,Q-1);render()">−</button><span>${Q}</span><button onclick="Q++;render()">+</button></div><span class="muted" style="font-size:12px">× ${fmt(a.cost)}</span></div>
 <div class="ladder">${BULK.filter(b=>b[0]>1).map(([n,x])=>`<span class="${Q>=n?'on':''}">${n}+ · −${x}%</span>`).join('')}</div>
 <div class="tot"><span class="muted">Total${d?` after ${d}% off`:''}</span><span class="price">${fmt(t)}</span></div>
 <button class="btn pri" style="height:38px;font-size:13px" onclick="CASH-=${t};OWNED['${a.model}']=(OWNED['${a.model}']||0)+Q;render()">Buy ${Q} ${a.name}${Q>1?'s':''}</button><span class="muted" style="font-size:11px;text-align:center">Cash after: ${fmt(CASH-t)}</span></div></div>
 <div class="note">Concept C — Hangar browser. A compact list on the left (thumb, name, seats/range, price) and one big spec sheet on the right: hero art with the name on it, four stat bars, the role and how many of your routes it can fly, and an order panel with a quantity stepper, the bulk-discount ladder lighting up as you add, and the cash left afterwards. One aircraft in focus at a time.</div>`;
